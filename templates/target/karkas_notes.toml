# Karkas settings of a notes project (docs/adr/0039). The API key comes only from ANTHROPIC_API_KEY
# (or the variable an API names with api_key_env). The notes assistant runs on the tier of
# [roles] notes; Settings → Models and API in karkas-gui edits this file.

[models.strong]
provider = "anthropic"
model    = "claude-opus-5-5"

[models.medium]
provider = "anthropic"
model    = "claude-sonnet-5-5"

[models.cheap]
provider = "anthropic"
model    = "claude-haiku-5-5"

[roles]
notes = "medium"   # the assistant that reads the notes, answers and proposes edits

[limits]
max_steps_worker   = 25       # steps of one assistant run
max_tokens_per_run = 150000

[cache]
ttl = "5m"

[prices]   # USD per 1M tokens; check the official pricing page before relying on these
"claude-opus-5-5"   = { input = 4.0, output = 20.0, cache_read = 0.20 }
"claude-sonnet-5-5" = { input = 2.0, output = 10.0, cache_read = 0.10 }
"claude-haiku-5-5"  = { input = 0.10, output = 0.50 }
cache_write_5m = 1.25
cache_write_1h = 2.0
cache_read     = 0.1

# [agents]
# auto_approve = true   # the assistant's proposals are applied at once (no review)
