# Karkas settings (appendix E). The API key comes only from ANTHROPIC_API_KEY.
[project]
lang      = "cpp"
build     = "cmake-ninja"
build_dir = "build"
# cmake_args = "-DBUILD_TESTS=ON"   # extra arguments of the CMake configure step
# A project with its own CMakeLists.txt and its own build tree (presets): the command that builds
# it, from the project root; Karkas then configures nothing (agents and kk_run_tests use it).
# build_command = "cmake --build --preset release"
# Its compile_commands.json (found in the root or the build folder when not set): a worker's build()
# compiles only its files with it, and the full build runs once per ticket (ADR 0028).
# compile_commands = "build/release/compile_commands.json"
# A quicker build that checks the agents' work (no LTO, no optimizer); the release build_command is then
# left to you or CI (ADR 0029). A debug game can run its tests much slower: measure both.
# verify_command = "cmake --build --preset debug"

# A project with its own CMakeLists.txt (imported code): the command that runs its tests after
# the build, from the project root. Without it kk_run_tests / karkas test run ctest.
# With dir and guide a feature ticket ends with a behaviour test: a tester writes one test in the
# project's own framework into dir, as the guide says, and the command runs it (it gets the ticket's
# test files in KK_TEST_FILES); a failing test goes back to the orchestrator (ADR 0029).
# [test]
# command = "build/tests/run_all"
# dir     = "tests/behaviour"
# guide   = "tests/HOWTO.md"

[models.strong]
provider = "anthropic"
model    = "claude-opus-5-5"

[models.medium]
provider = "anthropic"
model    = "claude-sonnet-5-5"

[models.cheap]
provider = "anthropic"
model    = "claude-haiku-5-5"

[roles]
architect    = "strong"
orchestrator = "strong"
navigator    = "medium"
worker       = "auto"
tester       = "cheap"

# Models per part of the block tree (ADR 0011). A block's own choice beats its level, a level
# beats [roles]. Any [models.<name>] fits, also another API:
# [models.local]
# provider    = "openai_compat"
# model       = "qwen3-coder"
# base_url    = "http://localhost:11434/v1"
# api_key_env = "OLLAMA_API_KEY"   # the variable's name only; keys never go into files
#
# [levels]
# 0 = "strong"   # the project: orchestrator, architect of the top level
# 2 = "cheap"    # blocks two levels down
#
# [blocks]
# "world.pickups" = "local"   # this block and everything inside it

[routing]
cheap_max                  = 3
medium_max                 = 6
attempts_before_escalation = 2

[limits]
max_steps_worker    = 25
max_steps_navigator = 6
max_tokens_per_run  = 150000
max_parallel_agents = 2
max_parallel_builds = 1
build_timeout_s     = 300
test_timeout_s      = 120
request_timeout_s   = 300

[cache]
ttl = "5m"

[prices]   # USD per 1M tokens; check the official pricing page before relying on these
"claude-opus-5-5"   = { input = 4.0, output = 20.0, cache_read = 0.20 }
"claude-sonnet-5-5" = { input = 2.0, output = 10.0, cache_read = 0.10 }
"claude-haiku-5-5"  = { input = 0.10, output = 0.50 }
cache_write_5m = 1.25
cache_write_1h = 2.0
cache_read     = 0.1

[gui]
editor_command = "kitty -e nvim +{line} {file}"

# Mode mcp (karkas mode mcp): Claude models through Claude Code instead of an API key. With launch =
# "claude" Karkas serves its agents' turns itself: one headless Claude Code per run (`claude -p` on your
# claude.ai login, the model of the run's tier, only the two turn tools); no session has to serve them
# and kk_task / `karkas task` just run (ADR 0029).
# [agents]
# mode   = "mcp"
# launch = "claude"
# launch_budget_usd = 2   # --max-budget-usd of each run (0 = none)
